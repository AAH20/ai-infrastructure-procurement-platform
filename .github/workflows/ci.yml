name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: aiip examples/retail-ai-rfp.json --as-of 2026-09-06 --output procurement-decision.json
      - run: aiip-exchange --rfp examples/exchange-synthetic/rfp.json --offers-dir examples/exchange-synthetic/offers --as-of 2026-09-24 --output exchange-decision.json
      - run: python -c 'import json; d=json.load(open("exchange-decision.json")); assert d["comparison"]["decision"] == "NO_ELIGIBLE_OFFER" and not d["deployment_handoff"]["deployment_authorized"]'
      - uses: actions/upload-artifact@v4
        with:
          name: procurement-decision
          path: |
            procurement-decision.json
            exchange-decision.json
