name: AI Infrastructure Procurement Evaluation
description: Evaluate GPU cloud and LLM infrastructure offers against an evidence-driven RFP
inputs:
  bundle: {description: RFP and offers JSON, required: true}
  as-of: {description: Evaluation date in YYYY-MM-DD, required: true}
  output: {description: Decision report, default: procurement-decision.json}
runs:
  using: composite
  steps:
    - shell: bash
      run: pip install "${{ github.action_path }}"
    - shell: bash
      run: aiip "${{ inputs.bundle }}" --as-of "${{ inputs.as-of }}" --output "${{ inputs.output }}"

